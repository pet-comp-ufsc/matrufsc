services:
  crawler-api:
    build:
      context: ./crawler-api
    container_name: cagr_api-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Se quiser editar o código e ver as mudanças em tempo real (dev mode):
      # - ./app:/app/app
    environment:
      - TZ=America/Sao_Paulo

  web:
    container_name: web-dev
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
